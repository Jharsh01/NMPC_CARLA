[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overtake-nmpc"
version = "0.1.0"
description = "NMPC overtaking at the friction limit, with a pure-pursuit baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "casadi>=3.6,<3.8",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "imageio-ffmpeg>=0.4",
    "pybind11>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: closed-loop runs that take more than a second; skipped by the quick check in preflight.py"]
